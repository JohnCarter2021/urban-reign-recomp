# Status map data (docs/status/map.*.svg and docs/status/details.*.md).
# After editing, regenerate with:  python tools/status/generate.py
#
# States: "ok" (works), "parcial" (works with issues or unverified), "pendiente" (not working / not emulated).

# ---------------------------------------------------------------------------------------------------------
# Panel 1: Sony SDK 2.8 static libraries linked into SLUS_212.09.
# Every function of docs/status/functions.csv between `desde` and `hasta` is a cell. A library starts at
# `inicio` and runs to the next one. Order and versions come from the "PsIIlib*" signatures in the ELF;
# starts come from identified SDK functions (src/urban/sdk_functions.inc) and the SIF RPC ids each
# library binds (pad 0x80000100, mtap 0x80000901, sdr 0x80000701, cdvd 0x8000059x, mc 0x80000400).
# Boundaries marked "approx." are within a few functions.
# ---------------------------------------------------------------------------------------------------------
