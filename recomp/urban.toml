[general]
input = "../build/SLUS_212.09"
output = "../generated"
single_file_output = false
output_worker_threads = 4
# Function map exported from Ghidra (tools/ghidra_functions.py): adds the ~1.5k functions the recompiler's own
# discovery merges into their predecessor (only reachable through pointers). Kept in the repository, so generating
# the code needs no Ghidra. Ignored when the file is missing.
ghidra_output = "urban_functions.csv"
# Merge: keep the recompiler's own discoveries (818 that Ghidra misses, e.g. the 0x1d5cb8 vtable method).
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
# The ELF has no symbols; SDK functions are identified by address and bound to runtime handlers at start-up
# (src/urban/hle_bindings.cpp), so nothing is stubbed by name here.
auto_stub_by_name = false
# Tail jumps must go through the dispatch table, or replacing a function at run time would miss those callers.
direct_tail_calls = false
skip = []
stubs = []
