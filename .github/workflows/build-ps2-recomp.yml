name: build-ps2-recomp
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure ps2_recomp
        shell: cmd
        env:
          VSROOT: C:\Program Files\Microsoft Visual Studio\2022\Enterprise
        run: cmd /c tools\win\vsenv.cmd cmake -S runtime\ps2xRecomp -B build-ps2recomp -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build ps2_recomp
        shell: cmd
        env:
          VSROOT: C:\Program Files\Microsoft Visual Studio\2022\Enterprise
        run: cmd /c tools\win\vsenv.cmd cmake --build build-ps2recomp --target ps2_recomp -- -j 4
      - name: Upload ps2_recomp.exe
        uses: actions/upload-artifact@v4
        with:
          name: ps2_recomp-windows
          path: build-ps2recomp\ps2_recomp.exe
          if-no-files-found: error
